name: Margaret River Accom Monitor

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-24.04 # Pins to a stable LTS runner to eliminate the ubuntu-latest migration notice

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2 # Uses the latest Node 24-compatible patch release

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monitor Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python monitor.py
